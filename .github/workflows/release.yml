name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        run: |
          pyinstaller --onefile --name LocalAgent-Windows --add-data "soul.md;." web/local_agent.py

      - name: Build macOS app bundle
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --windowed --name LocalAgent --add-data "soul.md:." web/local_agent.py
          ditto -c -k --sequesterRsrc --keepParent dist/LocalAgent.app dist/LocalAgent-macOS.zip

      - name: Build Linux binary
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --onefile --name LocalAgent-Linux --add-data "soul.md:." web/local_agent.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-${{ matrix.platform }}
          path: |
            dist/LocalAgent-Windows.exe
            dist/LocalAgent-macOS.zip
            dist/LocalAgent-Linux

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
